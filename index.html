<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog de Tecnologia e Educação</title>
    <style>
        /* Estilos globais */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* Estilização do Header (Cabeçalho) */
        header {
            background-color: #183C63;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Estilização do Conteúdo Principal */
        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 16px;
            background-color: #ffffff;
        }

        /* Ajuste do tamanho da Imagem */
        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tecnologia e Educação</h1>
    </header>

    <main>
        <!-- Imagem com atributos src e alt conforme a aula -->
        <img src="imagem-blog.png" alt="logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">
        
        <h2>Aprendendo Web Development</h2>
        <p>Este é o projeto desenvolvido durante as aulas, aplicando conceitos de espaçamento como margin, padding e inserção de elementos visuais.</p>
    </main>

</body>
</html>
